version: "3.8"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: nikita
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nikita -d mydatabase"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://nikita:password@db:5432/mydatabase
      FRONTEND_INTERNAL_URL: http://frontend:3000
      REVALIDATE_SECRET: "change-me-please"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "/api"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
    environment:
      NEXT_PUBLIC_API_URL: "/api"
      NEXT_PUBLIC_CANONICAL_BASE_URL: "http://frontend:3000"
      API_INTERNAL_URL: "http://backend:8000/api"
      REVALIDATE_SECRET: "change-me-please"

  nginx:
    image: nginx:latest
    ports:
      - "81:81"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/static:/usr/share/nginx/html/static:ro

    depends_on:
      - backend
      - frontend
