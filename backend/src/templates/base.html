<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Админка{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 260px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 1000;
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.1);
        }
        .main-content {
            margin-left: 260px;
            padding: 2rem;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        .nav-link {
            border-radius: 12px;
            margin: 0.25rem 0;
            transition: all 0.3s ease;
        }
        .nav-link:hover {
            background: rgba(102, 126, 234, 0.1);
            transform: translateX(5px);
        }
        .nav-link.active {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white !important;
        }
        .brand {
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: bold;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="p-4">
            <h4 class="brand mb-4">
                <i class="bi bi-shield-check"></i> AdminPanel
            </h4>
            <nav class="nav flex-column">
                <a href="/admin" class="nav-link text-dark d-flex align-items-center py-3">
                    <i class="bi bi-house-door me-3"></i>
                    Главная
                </a>
                <a href="/admin/models" class="nav-link text-dark d-flex align-items-center py-3">
                    <i class="bi bi-people me-3"></i>
                    Модели
                </a>
                <a href="/admin/sites" class="nav-link text-dark d-flex align-items-center py-3">
                    <i class="bi bi-people me-3"></i>
                    Настройки сайта
                </a>
                <a href="/admin/services" class="nav-link text-dark d-flex align-items-center py-3">
                    <i class="bi bi-gear me-3"></i>
                    Услуги
                </a>
                <form action="/admin/services/revalidate-all" method="post" class="mt-2">
                    <button type="submit" class="btn btn-sm btn-outline-success w-100">
                        <i class="bi bi-arrow-repeat me-1"></i> Обновить все услуги
                    </button>
                </form>
            </nav>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="glass-card p-4 mb-4">
            {% block content %}{% endblock %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
